<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>German Bundesliga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; color: #1e293b; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; }
        ::-webkit-scrollbar-thumb { background: #d3010c; border-radius: 10px; }
        .scrollbar-hidden::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="bg-[#d3010c] border-b-4 border-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-3 py-3 flex flex-row justify-between items-center gap-2">
            <div class="flex items-center gap-2">
                <div class="bg-white p-1 rounded-lg h-9 w-9 overflow-hidden flex items-center justify-center">
                    <img src="https://upload.wikimedia.org/wikipedia/en/d/df/Bundesliga_logo_%282017%29.svg" alt="Bundesliga" class="h-full w-full object-contain">
                </div>
                <div>
                    <h1 class="text-sm font-black text-white">German <span class="text-white">Bundesliga</span></h1>
                    <p class="text-[8px] text-red-200 font-bold uppercase tracking-widest">THE ONE COMMUNITY</p>
                </div>
            </div>
            <div class="flex bg-white/20 p-0.5 rounded-lg border border-white/30">
                <button id="tab-fixtures-btn" onclick="switchTab('fixtures')" class="px-3 py-1.5 rounded-md text-[10px] font-bold text-[#d3010c] bg-white shadow-lg">Fixtures</button>
                <button id="tab-standings-btn" onclick="switchTab('standings')" class="px-3 py-1.5 rounded-md text-[10px] font-bold text-white">Standings</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-3 py-5 flex-1 w-full">
        <div class="grid grid-cols-2 gap-2 mb-5">
            <div class="bg-white border border-red-100 p-3 rounded-xl flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-shield-halved text-[#d3010c] text-sm"></i>
                <div><span class="text-[8px] text-slate-500 block uppercase">TEAMS</span><span class="text-sm font-bold text-slate-800">12</span></div>
            </div>
            <div class="bg-white border border-red-100 p-3 rounded-xl flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-calendar-check text-[#d3010c] text-sm"></i>
                <div><span class="text-[8px] text-slate-500 block uppercase">MATCHES</span><span class="text-sm font-bold text-slate-800">66</span></div>
            </div>
        </div>

        <div id="tab-fixtures-content" class="space-y-4">
            <div class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm">
                <span class="text-[10px] font-bold text-[#d3010c] uppercase mb-2 block">Matchday Selector</span>
                <div class="flex gap-2 overflow-x-auto scrollbar-hidden pb-1" id="matchday-selector-container"></div>
            </div>

            <div class="flex justify-between items-center bg-[#d3010c] p-3 rounded-xl shadow-lg">
                <h2 class="text-sm font-black text-white" id="fixture-round-title">ROUND 1</h2>
                <div class="flex gap-1">
                    <button onclick="changeMatchday(-1)" class="w-8 h-8 bg-white/20 rounded-lg text-white"><i class="fa-solid fa-chevron-left"></i></button>
                    <button onclick="changeMatchday(1)" class="w-8 h-8 bg-white/20 rounded-lg text-white"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
            <div class="grid grid-cols-1 gap-3" id="fixtures-grid"></div>
        </div>

        <div id="tab-standings-content" class="hidden space-y-4">
            <div class="bg-white border border-slate-200 rounded-xl overflow-x-auto text-[10px] shadow-sm">
                <table class="w-full text-center min-w-[500px]">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr class="text-slate-600">
                            <th class="py-3 px-2">#</th>
                            <th class="py-3 text-left pl-2">TEAM</th>
                            <th class="py-3">M</th>
                            <th class="py-3">W</th>
                            <th class="py-3">D</th>
                            <th class="py-3">L</th>
                            <th class="py-3 hidden sm:table-cell">GF</th>
                            <th class="py-3 hidden sm:table-cell">GA</th>
                            <th class="py-3">GD</th>
                            <th class="py-3 text-[#d3010c]">pts</th>
                        </tr>
                    </thead>
                    <tbody id="standings-table-body" class="divide-y divide-slate-100 font-medium text-slate-800"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const TEAMS_LIST = [
            { id: "FCB", name: "Bayern Munich", logo: "https://upload.wikimedia.org/wikipedia/commons/1/1b/FC_Bayern_M%C3%BCnchen_logo_%282017%29.svg", tg: "https://t.me/tddgdu" },
            { id: "BVB", name: "Dortmund", logo: "https://upload.wikimedia.org/wikipedia/commons/6/67/Borussia_Dortmund_logo.svg", tg: "https://t.me/KoKyaw_KYT" },
            { id: "RBL", name: "RB Leipzig", logo: "https://upload.wikimedia.org/wikipedia/en/0/04/RB_Leipzig_2014_logo.svg", tg: "https://t.me/Myan_Khun" },
            { id: "B04", name: "Leverkusen", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/5/59/Bayer_04_Leverkusen_logo.svg/1280px-Bayer_04_Leverkusen_logo.svg.png", tg: "https://t.me/mikeyjn" },
            { id: "SGE", name: "Frankfurt", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/7/7e/Eintracht_Frankfurt_crest.svg/1280px-Eintracht_Frankfurt_crest.svg.png", tg: "https://t.me/Veiotf" },
            { id: "FCU", name: "Union Berlin", logo: "https://upload.wikimedia.org/wikipedia/commons/4/44/1._FC_Union_Berlin_Logo.svg", tg: "https://t.me/merrydesu" },
            { id: "SCF", name: "Freiburg", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/6/6d/SC_Freiburg_logo.svg/960px-SC_Freiburg_logo.svg.png", tg: "https://t.me/" },
            { id: "SVW", name: "Werder Bremen", logo: "https://upload.wikimedia.org/wikipedia/commons/b/be/SV-Werder-Bremen-Logo.svg", tg: "https://t.me/Turkey772" },
            { id: "STP", name: "Saint Pauli", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/8/81/FC_St._Pauli_logo.svg/250px-FC_St._Pauli_logo.svg.png", tg: "https://t.me/kharkhar1225" },
            { id: "WOB", name: "Wolfsburg", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/VfL_Wolfsburg_logo_2026.svg/1280px-VfL_Wolfsburg_logo_2026.svg.png", tg: "https://t.me/Badrul11" },
            { id: "VFB", name: "VFB Stuttgart", logo: "https://upload.wikimedia.org/wikipedia/commons/e/eb/VfB_Stuttgart_1893_Logo.svg", tg: "https://t.me/Kyawthaik468" },
            { id: "M05", name: "FSV Mainz 05", logo: "https://upload.wikimedia.org/wikipedia/commons/9/9e/Logo_Mainz_05.svg", tg: "https://t.me/zayar251" }
        ].map(t => ({...t, mp:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0}));

        let fixtures = [], currentViewingMatchday = 0, TOTAL_ROUNDS = 11;

        window.onload = function() { 
            generateFixedRoundRobinFixtures(); 
            // Injects scores for Round 1
            fixtures[0] = [
                { home: 'FCB', away: 'M05', hs: 3, as: 2 },
                { home: 'BVB', away: 'VFB', hs: 4, as: 4 },
                { home: 'RBL', away: 'WOB', hs: 3, as: 3 },
                { home: 'B04', away: 'STP', hs: 0, as: 3 },
                { home: 'SGE', away: 'SVW', hs: 1, as: 7 },
                { home: 'FCU', away: 'SCF', hs: 3, as: 0 }
            ];
            // Injects scores for Round 2
            fixtures[1] = [
                { home: 'BVB', away: 'M05', hs: 7, as: 0 },
                { home: 'RBL', away: 'FCB', hs: 5, as: 1 },
                { home: 'B04', away: 'VFB', hs: 3, as: 6 },
                { home: 'SGE', away: 'WOB', hs: 2, as: 6 },
                { home: 'FCU', away: 'STP', hs: 0, as: 4 },
                { home: 'SCF', away: 'SVW', hs: 1, as: 2 }
            ];
            renderMatchdaySelector(); 
            renderFixtures(); 
        };

        function switchTab(tab) {
            document.getElementById('tab-fixtures-content').classList.toggle('hidden', tab !== 'fixtures');
            document.getElementById('tab-standings-content').classList.toggle('hidden', tab !== 'standings');

            document.getElementById('tab-fixtures-btn').className = tab === 'fixtures' ? "px-3 py-1.5 rounded-md text-[10px] font-bold text-[#d3010c] bg-white shadow-lg" : "px-3 py-1.5 rounded-md text-[10px] font-bold text-white";
            document.getElementById('tab-standings-btn').className = tab === 'standings' ? "px-3 py-1.5 rounded-md text-[10px] font-bold text-[#d3010c] bg-white shadow-lg" : "px-3 py-1.5 rounded-md text-[10px] font-bold text-white";
        }

        function generateFixedRoundRobinFixtures() {
            const numTeams = TEAMS_LIST.length;
            for (let round = 0; round < numTeams - 1; round++) {
                const roundMatches = [];
                for (let i = 0; i < numTeams / 2; i++) {
                    const home = (round + i) % (numTeams - 1), away = (i === 0) ? numTeams - 1 : (numTeams - 1 - i + round) % (numTeams - 1);
                    roundMatches.push({ home: TEAMS_LIST[home].id, away: TEAMS_LIST[away].id });
                }
                fixtures.push(roundMatches);
            }
        }

        function renderMatchdaySelector() {
            const container = document.getElementById('matchday-selector-container');
            for (let r = 0; r < TOTAL_ROUNDS; r++) {
                const btn = document.createElement('button');
                btn.className = `flex-shrink-0 px-3 py-1 rounded-lg font-bold text-[10px] border ${r === 0 ? 'bg-[#d3010c] text-white' : 'bg-white text-slate-500 border-slate-200'}`;
                btn.innerText = `R${r + 1}`;
                btn.onclick = () => { 
                    currentViewingMatchday = r; 
                    document.querySelectorAll('#matchday-selector-container button').forEach((b, idx) => {
                        b.className = `flex-shrink-0 px-3 py-1 rounded-lg font-bold text-[10px] border ${idx === r ? 'bg-[#d3010c] text-white' : 'bg-white text-slate-500 border-slate-200'}`;
                    });
                    renderFixtures(); 
                };
                container.appendChild(btn);
            }
        }

        function renderFixtures() {
            const container = document.getElementById('fixtures-grid');
            container.innerHTML = '';
            document.getElementById('fixture-round-title').innerText = `ROUND ${currentViewingMatchday + 1}`;

            if(!fixtures[currentViewingMatchday]) return;

            fixtures[currentViewingMatchday].forEach(match => {
                const h = TEAMS_LIST.find(t => t.id === match.home);
                const a = TEAMS_LIST.find(t => t.id === match.away);
                
                const hasScore = match.hs !== undefined && match.hs !== null;
                const scoreDisplay = hasScore ? `${match.hs} - ${match.as}` : "VS";
                const scoreColor = hasScore ? "text-slate-800 font-black" : "text-[#d3010c] font-black";

                const card = document.createElement('div');
                card.className = "bg-white border border-slate-100 rounded-xl p-3 flex items-center justify-between shadow-sm";
                card.innerHTML = `
                    <a href="${h.tg}" target="_blank" class="flex items-center gap-2 w-[40%] cursor-pointer hover:opacity-70">
                        <img src="${h.logo}" class="w-8 h-8 object-contain">
                        <span class="text-xs font-bold truncate text-slate-700">${h.name}</span>
                    </a>
                    <div class="flex flex-col items-center w-[20%]">
                        <span class="${scoreColor} text-[10px]">${scoreDisplay}</span>
                    </div>
                    <a href="${a.tg}" target="_blank" class="flex items-center gap-2 w-[40%] justify-end cursor-pointer hover:opacity-70">
                        <span class="text-xs font-bold truncate text-slate-700">${a.name}</span>
                        <img src="${a.logo}" class="w-8 h-8 object-contain">
                    </a>`;
                container.appendChild(card);
            });
        }

        function changeMatchday(d) {
            let n = currentViewingMatchday + d;
            if (n >= 0 && n < TOTAL_ROUNDS) { 
                currentViewingMatchday = n; 
                document.querySelectorAll('#matchday-selector-container button').forEach((b, idx) => {
                    b.className = `flex-shrink-0 px-3 py-1 rounded-lg font-bold text-[10px] border ${idx === n ? 'bg-[#d3010c] text-white' : 'bg-white text-slate-500 border-slate-200'}`;
                });
                renderFixtures(); 
            }
        }
    </script>
</body>
</html>
