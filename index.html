<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>German Bundesliga</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; color: #1e293b; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; }
        ::-webkit-scrollbar-thumb { background: #d3010c; border-radius: 10px; }
        .scrollbar-hidden::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <header class="bg-[#d3010c] border-b-4 border-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-3 py-3 flex flex-row justify-between items-center gap-2">
            <div class="flex items-center gap-2">
                <div class="bg-white p-1 rounded-lg h-9 w-9 overflow-hidden flex items-center justify-center">
                    <img src="https://upload.wikimedia.org/wikipedia/en/d/df/Bundesliga_logo_%282017%29.svg" alt="Bundesliga" class="h-full w-full object-contain">
                </div>
                <div>
                    <h1 class="text-sm font-black text-white">German <span class="text-white">Bundesliga</span></h1>
                    <p class="text-[8px] text-red-200 font-bold uppercase tracking-widest">THE ONE COMMUNITY</p>
                </div>
            </div>
            <div class="flex bg-white/20 p-0.5 rounded-lg border border-white/30">
                <button id="tab-fixtures-btn" onclick="switchTab('fixtures')" class="px-3 py-1.5 rounded-md text-[10px] font-bold text-[#d3010c] bg-white shadow-lg">Fixtures</button>
                <button id="tab-standings-btn" onclick="switchTab('standings')" class="px-3 py-1.5 rounded-md text-[10px] font-bold text-white">Standings</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-3 py-5 flex-1 w-full">
        <div class="grid grid-cols-2 gap-2 mb-5">
            <div class="bg-white border border-red-100 p-3 rounded-xl flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-shield-halved text-[#d3010c] text-sm"></i>
                <div><span class="text-[8px] text-slate-500 block uppercase">TEAMS</span><span class="text-sm font-bold text-slate-800">12</span></div>
            </div>
            <div class="bg-white border border-red-100 p-3 rounded-xl flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-calendar-check text-[#d3010c] text-sm"></i>
                <div><span class="text-[8px] text-slate-500 block uppercase">MATCHES</span><span class="text-sm font-bold text-slate-800">66</span></div>
            </div>
        </div>

        <div id="tab-fixtures-content" class="space-y-4">
            <div class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm">
                <span class="text-[10px] font-bold text-[#d3010c] uppercase mb-2 block">Matchday Selector</span>
                <div class="flex gap-2 overflow-x-auto scrollbar-hidden pb-1" id="matchday-selector-container"></div>
            </div>

            <div class="flex justify-between items-center bg-[#d3010c] p-3 rounded-xl shadow-lg">
                <h2 class="text-sm font-black text-white" id="fixture-round-title">ROUND 1</h2>
                <div class="flex gap-1">
                    <button onclick="changeMatchday(-1)" class="w-8 h-8 bg-white/20 rounded-lg text-white"><i class="fa-solid fa-chevron-left"></i></button>
                    <button onclick="changeMatchday(1)" class="w-8 h-8 bg-white/20 rounded-lg text-white"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
            <div class="grid grid-cols-1 gap-3" id="fixtures-grid"></div>
        </div>

        <div id="tab-standings-content" class="hidden space-y-4">
            <div class="bg-white border border-slate-200 rounded-xl overflow-x-auto text-[10px] shadow-sm">
                <table class="w-full text-center min-w-[500px]">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr class="text-slate-600">
                            <th class="py-3 px-2">#</th>
                            <th class="py-3 text-left pl-2">TEAM</th>
                            <th class="py-3">M</th>
                            <th class="py-3">W</th>
                            <th class="py-3">D</th>
                            <th class="py-3">L</th>
                            <th class="py-3 hidden sm:table-cell">GF</th>
                            <th class="py-3 hidden sm:table-cell">GA</th>
                            <th class="py-3">GD</th>
                            <th class="py-3 text-[#d3010c]">pts</th>
                        </tr>
                    </thead>
                    <tbody id="standings-table-body" class="divide-y divide-slate-100 font-medium text-slate-800"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const TEAMS_LIST = [
            { id: "FCB", name: "Bayern Munich", logo: "https://upload.wikimedia.org/wikipedia/commons/1/1b/FC_Bayern_M%C3%BCnchen_logo_%282017%29.svg", tg: "https://t.me/itxkian223Z" },
            { id: "BVB", name: "Dortmund", logo: "https://upload.wikimedia.org/wikipedia/commons/6/67/Borussia_Dortmund_logo.svg", tg: "https://t.me/soelay0" },
            { id: "RBL", name: "RB Leipzig", logo: "https://upload.wikimedia.org/wikipedia/en/0/04/RB_Leipzig_2014_logo.svg", tg: "https://t.me/johnharry73" },
            { id: "B04", name: "Leverkusen", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/5/59/Bayer_04_Leverkusen_logo.svg/1280px-Bayer_04_Leverkusen_logo.svg.png", tg: "https://t.me/kenzjust" },
            { id: "SGE", name: "Frankfurt", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/7/7e/Eintracht_Frankfurt_crest.svg/1280px-Eintracht_Frankfurt_crest.svg.png", tg: "https://t.me/UKyawMaung13" },
            { id: "FCU", name: "Union Berlin", logo: "https://upload.wikimedia.org/wikipedia/commons/4/44/1._FC_Union_Berlin_Logo.svg", tg: "https://t.me/Mg_Leon2" },
            { id: "SCF", name: "Freiburg", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/6/6d/SC_Freiburg_logo.svg/960px-SC_Freiburg_logo.svg.png", tg: "https://t.me/Xuman88" },
            { id: "SVW", name: "Werder Bremen", logo: "https://upload.wikimedia.org/wikipedia/commons/b/be/SV-Werder-Bremen-Logo.svg", tg: "https://t.me/Nyanzayar" },
            { id: "STP", name: "Saint Pauli", logo: "https://upload.wikimedia.org/wikipedia/en/thumb/8/81/FC_St._Pauli_logo.svg/250px-FC_St._Pauli_logo.svg.png", tg: "https://t.me/Cr7hmh" },
            { id: "WOB", name: "Wolfsburg", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/VfL_Wolfsburg_logo_2026.svg/1280px-VfL_Wolfsburg_logo_2026.svg.png", tg: "https://t.me/Aung_Htet_Paing23" },
            { id: "VFB", name: "VFB Stuttgart", logo: "https://upload.wikimedia.org/wikipedia/commons/e/eb/VfB_Stuttgart_1893_Logo.svg", tg: "https://t.me/MRTONE3" },
            { id: "M05", name: "FSV Mainz 05", logo: "https://upload.wikimedia.org/wikipedia/commons/9/9e/Logo_Mainz_05.svg", tg: "https://t.me/Nyi2005MAY" }
        ].map(t => ({...t, mp:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0}));

        // ရလဒ်များထည့်ရန် Format - { h: 'HomeID', a: 'AwayID', hs: Score, as: Score }
        const MATCH_RESULTS = {
            0: [
                { h: 'RBL', a: 'WOB', hs: 0, as: 2  },
                { h: 'B04', a: 'STP', hs: 4, as: 0 },
                { h: 'SGE', a: 'SVW', hs: 7, as: 2 },
                { h: 'FCU', a: 'SCF', hs: 5, as: 4  },
                { h: 'BVB', a: 'VFB', hs: 1, as: 2 },
                { h: 'FCB', a: 'M05',hs: 2, as: 3 }
            ],
            1: [
                { h: 'BVB', a: 'M05', hs: 9, as: 0 },
                { h: 'RBL', a: 'FCB', hs: 6, as: 1 },
                { h: 'B04', a: 'VFB', hs: 2, as: 0 },
                { h: 'SGE', a: 'WOB', hs: 2, as: 3 },
                { h: 'FCU', a: 'STP', hs: 7, as: 1 },
                { h: 'SCF', a: 'SVW', hs: 6, as: 0 }
            ],
            2: [
                { h: 'RBL', a: 'M05', hs: 6, as: 2 },
                { h: 'B04', a: 'BVB', hs: 2, as: 0 },
                { h: 'SGE', a: 'FCB', hs: 5, as: 1 },
                { h: 'FCU', a: 'VFB', hs: 3, as: 4 },
                { h: 'SCF', a: 'WOB', hs: 0, as: 4 },
                { h: 'SVW', a: 'STP', hs: 6, as: 0 }
            ],
            3: [
                { h: 'B04', a: 'M05', hs: 5, as: 4 },
                { h: 'SGE', a: 'RBL', hs: 2, as: 4 },
                { h: 'FCU', a: 'BVB', hs: 3, as: 8 },
                { h: 'SCF', a: 'FCB', hs: 4, as: 0 },
                { h: 'SVW', a: 'VFB', hs: 2, as: 0 },
                { h: 'STP', a: 'WOB', hs: 0, as: 6 }
            ],
            4: [
                { h: 'SGE', a: 'M05', hs: 3, as: 0 },
                { h: 'FCU', a: 'B04', hs: 5, as: 2 },
                { h: 'SCF', a: 'RBL', hs: 6, as: 0 },
                { h: 'SVW', a: 'BVB', hs: 4, as: 1 },
                { h: 'STP', a: 'FCB', hs: 0, as: 3 },
                { h: 'WOB', a: 'VFB', hs: 5, as: 1 }
            ],
            5: [
                { h: 'FCU', a: 'M05', hs: 6, as: 3 },
                { h: 'SCF', a: 'SGE', hs: 2, as: 1 },
                { h: 'SVW', a: 'B04', hs: 0, as: 3},
                { h: 'STP', a: 'RBL', hs: 2, as: 3 },
                { h: 'WOB', a: 'BVB', hs: 3, as: 0 },
                { h: 'VFB', a: 'FCB', hs: 3, as: 2 }
            ],
            6: [
                { h: 'SCF', a: 'M05', hs: 4, as: 0  },
                { h: 'SVW', a: 'FCU', hs: 3, as: 1  },
                { h: 'STP', a: 'SGE', hs: 0 , as: 3 }, 
                { h: 'WOB', a: 'B04', hs: 4, as: 3  },
                { h: 'VFB', a: 'RBL', hs: 3, as: 0  },
                { h: 'FCB', a: 'BVB', hs: 1 , as: 3  }
            ],
            7: [
                { h: 'SVW', a: 'M05', hs: 3, as: 0 },
                { h: 'STP', a: 'SCF', hs: 0, as: 3},
                { h: 'WOB', a: 'FCU', hs: 3, as: 2 },
                { h: 'VFB', a: 'SGE', hs: 2, as: 3},
                { h: 'FCB', a: 'B04', hs: 1, as: 6},
                { h: 'BVB', a: 'RBL', hs: 3, as: 0}
            ],
            8: [
                { h: 'STP', a: 'M05', hs: 0, as: 3},
                { h: 'WOB', a: 'SVW', hs: 9, as: 1},
                { h: 'VFB', a: 'SCF', hs: 2, as: 5},
                { h: 'FCB', a: 'FCU', hs: 3, as: 4},
                { h: 'BVB', a: 'SGE', hs: 5, as: 2},
                { h: 'RBL', a: 'B04', hs: 0, as: 3}
            ],
            9: [
                { h: 'WOB', a: 'M05', hs: 3, as: 0 },
                { h: 'VFB', a: 'STP', hs: 3, as: 0 },
                { h: 'FCB', a: 'SVW', hs: 2, as: 3 },
                { h: 'BVB', a: 'SCF' ,hs: 4, as: 4 },
                { h: 'RBL', a: 'FCU' ,hs: 0, as: 3},
                { h: 'B04', a: 'SGE'}
            ],
            10: [
                { h: 'VFB', a: 'M05' },
                { h: 'FCB', a: 'WOB' },
                { h: 'BVB', a: 'STP' },
                { h: 'RBL', a: 'SVW' },
                { h: 'B04', a: 'SCF' },
                { h: 'SGE', a: 'FCU' }
            ]
        };

        let fixtures = [], currentViewingMatchday = 0, TOTAL_ROUNDS = 11;

        window.onload = function() { 
            generateFixedRoundRobinFixtures(); 
            calculateStandings();
            renderMatchdaySelector(); 
            renderFixtures(); 
        };

        function switchTab(tab) {
            document.getElementById('tab-fixtures-content').classList.toggle('hidden', tab !== 'fixtures');
            document.getElementById('tab-standings-content').classList.toggle('hidden', tab !== 'standings');

            document.getElementById('tab-fixtures-btn').className = tab === 'fixtures' ? "px-3 py-1.5 rounded-md text-[10px] font-bold text-[#d3010c] bg-white shadow-lg" : "px-3 py-1.5 rounded-md text-[10px] font-bold text-white";
            document.getElementById('tab-standings-btn').className = tab === 'standings' ? "px-3 py-1.5 rounded-md text-[10px] font-bold text-[#d3010c] bg-white shadow-lg" : "px-3 py-1.5 rounded-md text-[10px] font-bold text-white";

            if(tab === 'standings') updateStandingsTable();
        }

        function generateFixedRoundRobinFixtures() {
            const numTeams = TEAMS_LIST.length;
            for (let round = 0; round < numTeams - 1; round++) {
                const roundMatches = [];
                for (let i = 0; i < numTeams / 2; i++) {
                    const home = (round + i) % (numTeams - 1), away = (i === 0) ? numTeams - 1 : (numTeams - 1 - i + round) % (numTeams - 1);
                    roundMatches.push({ home: TEAMS_LIST[home].id, away: TEAMS_LIST[away].id });
                }
                fixtures.push(roundMatches);
            }
        }

        function calculateStandings() {
            TEAMS_LIST.forEach(t => { t.mp=0; t.w=0; t.d=0; t.l=0; t.gf=0; t.ga=0; t.gd=0; t.pts=0; });

            Object.values(MATCH_RESULTS).forEach(round => {
                round.forEach(match => {
                    if (match.hs !== undefined && match.as !== undefined) {
                        const h = TEAMS_LIST.find(t => t.id === match.h);
                        const a = TEAMS_LIST.find(t => t.id === match.a);

                        if(!h || !a) return;

                        h.mp++; a.mp++;
                        h.gf += match.hs; h.ga += match.as;
                        a.gf += match.as; a.ga += match.hs;
                        h.gd = h.gf - h.ga; a.gd = a.gf - a.ga;

                        if (match.hs > match.as) { h.pts += 3; h.w++; a.l++; }
                        else if (match.hs < match.as) { a.pts += 3; a.w++; h.l++; }
                        else { h.pts += 1; a.pts += 1; h.d++; a.d++; }
                    }
                });
            });
        }

        function renderMatchdaySelector() {
            const container = document.getElementById('matchday-selector-container');
            for (let r = 0; r < TOTAL_ROUNDS; r++) {
                const btn = document.createElement('button');
                btn.className = `flex-shrink-0 px-3 py-1 rounded-lg font-bold text-[10px] border ${r === 0 ? 'bg-[#d3010c] text-white' : 'bg-white text-slate-500 border-slate-200'}`;
                btn.innerText = `R${r + 1}`;
                btn.onclick = () => { 
                    currentViewingMatchday = r; 
                    document.querySelectorAll('#matchday-selector-container button').forEach((b, idx) => {
                        b.className = `flex-shrink-0 px-3 py-1 rounded-lg font-bold text-[10px] border ${idx === r ? 'bg-[#d3010c] text-white' : 'bg-white text-slate-500 border-slate-200'}`;
                    });
                    renderFixtures(); 
                };
                container.appendChild(btn);
            }
        }

        function renderFixtures() {
            const container = document.getElementById('fixtures-grid');
            container.innerHTML = '';
            document.getElementById('fixture-round-title').innerText = `ROUND ${currentViewingMatchday + 1}`;

            if(!fixtures[currentViewingMatchday]) return;

            fixtures[currentViewingMatchday].forEach(match => {
                const h = TEAMS_LIST.find(t => t.id === match.home);
                const a = TEAMS_LIST.find(t => t.id === match.away);

                const result = MATCH_RESULTS[currentViewingMatchday]?.find(r => r.h === h.id && r.a === a.id);
                const isCancelled = result && result.st === 'Cancelled';
                const hasScore = result && result.hs !== undefined && result.as !== undefined;

                const card = document.createElement('div');
                card.className = "bg-white border border-slate-100 rounded-xl p-3 flex items-center justify-between shadow-sm";
                card.innerHTML = `
                    <a href="${h.tg}" target="_blank" class="flex items-center gap-2 w-[40%] cursor-pointer hover:opacity-70">
                        <img src="${h.logo}" class="w-8 h-8 object-contain">
                        <span class="text-xs font-bold truncate text-slate-700">${h.name}</span>
                    </a>
                    <div class="flex flex-col items-center w-[20%]">
                        ${isCancelled ? `<span class="text-red-500 font-black text-[8px] uppercase">Cancelled</span>` : (hasScore ? `<span class="text-[#d3010c] font-black text-sm">${result.hs} - ${result.as}</span>` : '<span class="text-[#d3010c] font-black text-[10px]">VS</span>')}
                    </div>
                    <a href="${a.tg}" target="_blank" class="flex items-center gap-2 w-[40%] justify-end cursor-pointer hover:opacity-70">
                        <span class="text-xs font-bold truncate text-slate-700">${a.name}</span>
                        <img src="${a.logo}" class="w-8 h-8 object-contain">
                    </a>`;
                container.appendChild(card);
            });
        }

        function updateStandingsTable() {
            const tbody = document.getElementById('standings-table-body');
            const sortedTeams = [...TEAMS_LIST].sort((a, b) => b.pts - a.pts || b.gd - a.gd);

            tbody.innerHTML = sortedTeams.map((team, idx) => `
                <tr class="hover:bg-red-50 transition-colors">
                    <td class="py-3 px-2 text-slate-500">${idx+1}</td>
                    <td class="text-left py-3 pl-2">
                        <a href="${team.tg}" target="_blank" class="flex items-center gap-2 cursor-pointer hover:underline">
                            <img src="${team.logo}" class="w-5 h-5 object-contain">
                            <span class="font-bold text-slate-800">${team.name}</span>
                        </a>
                    </td>
                    <td class="py-3">${team.mp}</td>
                    <td class="py-3">${team.w}</td>
                    <td class="py-3">${team.d}</td>
                    <td class="py-3">${team.l}</td>
                    <td class="py-3 hidden sm:table-cell">${team.gf}</td>
                    <td class="py-3 hidden sm:table-cell">${team.ga}</td>
                    <td class="py-3">${team.gd}</td>
                    <td class="py-3 font-black text-[#d3010c]">${team.pts}</td>
                </tr>
            `).join('');
        }

        function changeMatchday(d) {
            let n = currentViewingMatchday + d;
            if (n >= 0 && n < TOTAL_ROUNDS) { 
                currentViewingMatchday = n; 
                document.querySelectorAll('#matchday-selector-container button').forEach((b, idx) => {
                    b.className = `flex-shrink-0 px-3 py-1 rounded-lg font-bold text-[10px] border ${idx === n ? 'bg-[#d3010c] text-white' : 'bg-white text-slate-500 border-slate-200'}`;
                });
                renderFixtures(); 
            }
        }
    </script>
</body>
</html>
