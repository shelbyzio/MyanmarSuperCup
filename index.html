<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MNL Style 12-Team Tournament Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; color: #1e293b; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; }
        ::-webkit-scrollbar-thumb { background: #0298f5; border-radius: 10px; }
        .scrollbar-hidden::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-[#003399] border-b-4 border-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-3 py-3 flex flex-row justify-between items-center gap-2">
            <div class="flex items-center gap-2">
                <div class="bg-white p-1 rounded-lg h-9 w-9 overflow-hidden flex items-center justify-center">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTKDqLfPOsbfcS0vYPM9vCJd-w6RPnP9YDMrQ&s" alt="MNL" class="h-full w-full object-contain">
                </div>
                <div>
                    <h1 class="text-sm font-black text-white">MYANMAR NATIONAL <span class="text-white">LEAGUE</span></h1>
                    <p class="text-[8px] text-blue-200 font-bold uppercase tracking-widest">THE ONE COMMUNITY</p>
                </div>
            </div>
            <div class="flex bg-white/20 p-0.5 rounded-lg border border-white/30">
                <button id="tab-fixtures-btn" onclick="switchTab('fixtures')" class="px-3 py-1.5 rounded-md text-[10px] font-bold text-[#003399] bg-white shadow-lg">Fixtures</button>
                <button id="tab-standings-btn" onclick="switchTab('standings')" class="px-3 py-1.5 rounded-md text-[10px] font-bold text-white">Standings</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-3 py-5 flex-1 w-full">
        <div class="grid grid-cols-2 gap-2 mb-5">
            <div class="bg-white border border-blue-100 p-3 rounded-xl flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-shield-halved text-[#003399] text-sm"></i>
                <div><span class="text-[8px] text-slate-500 block uppercase">TEAMS</span><span class="text-sm font-bold text-slate-800">12</span></div>
            </div>
            <div class="bg-white border border-blue-100 p-3 rounded-xl flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-calendar-check text-[#003399] text-sm"></i>
                <div><span class="text-[8px] text-slate-500 block uppercase">MATCHES</span><span class="text-sm font-bold text-slate-800">78</span></div>
            </div>
        </div>

        <div id="tab-fixtures-content" class="space-y-4">
            <div class="bg-white border border-slate-200 rounded-xl p-3 shadow-sm">
                <span class="text-[10px] font-bold text-[#003399] uppercase mb-2 block">Matchday Selector</span>
                <div class="flex gap-2 overflow-x-auto scrollbar-hidden pb-1" id="matchday-selector-container"></div>
            </div>

            <div class="flex justify-between items-center bg-[#003399] p-3 rounded-xl shadow-lg">
                <h2 class="text-sm font-black text-white" id="fixture-round-title">ROUND 1</h2>
                <div class="flex gap-1">
                    <button onclick="changeMatchday(-1)" class="w-8 h-8 bg-white/20 rounded-lg text-white"><i class="fa-solid fa-chevron-left"></i></button>
                    <button onclick="changeMatchday(1)" class="w-8 h-8 bg-white/20 rounded-lg text-white"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
            <div class="grid grid-cols-1 gap-3" id="fixtures-grid"></div>
        </div>

        <div id="tab-standings-content" class="hidden space-y-4">
            <div class="bg-white border border-slate-200 rounded-xl overflow-x-auto text-[10px] shadow-sm">
                <table class="w-full text-center min-w-[500px]">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr class="text-slate-600">
                            <th class="py-3 px-2">#</th>
                            <th class="py-3 text-left pl-2">TEAM</th>
                            <th class="py-3">M</th>
                            <th class="py-3">W</th>
                            <th class="py-3">D</th>
                            <th class="py-3">L</th>
                            <th class="py-3 hidden sm:table-cell">GF</th>
                            <th class="py-3 hidden sm:table-cell">GA</th>
                            <th class="py-3">GD</th>
                            <th class="py-3 text-[#003399]">pts</th>
                        </tr>
                    </thead>
                    <tbody id="standings-table-body" class="divide-y divide-slate-100 font-medium text-slate-800"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const TEAMS_LIST = [
            { id: "YNG", name: "Yangon United", logo: "https://upload.wikimedia.org/wikipedia/en/8/83/Yangon_United_F.C.png", tg: "https://t.me/MRTONE3" },
            { id: "YDN", name: "Yadanarbon FC", logo: "https://upload.wikimedia.org/wikipedia/en/8/83/Yadanabon_FC.png", tg: "https://t.me/Ranger13102003" },
            { id: "RKH", name: "Rakhine United", logo: "https://upload.wikimedia.org/wikipedia/en/e/e2/Rakhine_United_Football_Club.jpg", tg: "https://t.me/kenzjust" },
            { id: "SHN", name: "Shan United", logo: "https://upload.wikimedia.org/wikipedia/en/4/4a/Shan_United_Crest_2015.png", tg: "https://t.me/Alinn145678" },
            { id: "AYA", name: "Ayeyarwady United", logo: "https://upload.wikimedia.org/wikipedia/en/0/04/Ayeyawady_FC_logo.png", tg: "https://t.me/Nyanzayar" },
            { id: "YMU", name: "Yarmanya United", logo: "https://tmssl.akamaized.net//images/wappen/head/125345.png?lm=1734537118", tg: "https://t.me/Xuman88" },
            { id: "MAH", name: "Mahar United", logo: "https://sportcdns.live/team/bd64e5c3bfb068cbf8ddd03380c7478978d351f9ade615758640d0683da721e8.webp", tg: "https://t.me/oct_NaingDD11" },
            { id: "HTU", name: "Hantharwady United", logo: "https://upload.wikimedia.org/wikipedia/en/6/66/HANTHARWADY-UTD-FC-143x156.jpg", tg: "https://t.me/Fyhjfj_8046206" },
            { id: "DSU", name: "Dagon Star United", logo: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0kyEPh1DrFb1Emc2XKoTh7UpE7bmE8B8PSg&s", tg: "https://t.me/phoehtet2007" },
            { id: "TAU", name: "Thitsar Arman FC", logo: "https://sportcdns.live/team/936ef05b5d45020a8d2d2bf8319534233519edd0bfeedb28d809ad3c5597d6fe.webp", tg: "https://t.me/Aug2929" },
            { id: "ISP", name: "ISPE FC", logo: "https://upload.wikimedia.org/wikipedia/en/9/98/I.S.P.E_F.C._logo.png", tg: "https://t.me/DjOmega4102005" },
            { id: "DPU", name: "Dagon Port", logo: "https://tmssl.akamaized.net//images/wappen/head/116571.png?lm=1723840963", tg: "https://t.me/lugyiko123" }
        ].map(t => ({...t, mp:0, w:0, d:0, l:0, gf:0, ga:0, gd:0, pts:0}));

        const MATCH_RESULTS = {
            0: [{ home: 'RKH', away: 'TAU', hScore: 4, aScore: 1 }, { home: 'SHN', away: 'DSU', hScore: 1, aScore: 2 }, { home: 'AYA', away: 'HTU', hScore: 2, aScore: 2 }, { home: 'YMU', away: 'MAH', hScore: 4, aScore: 1 }, { home: 'YDN', away: 'ISP', hScore: 5, aScore: 5 }, { home: 'YNG', away: 'DPU', hScore: 6, aScore: 2 }],
            1: [{ home: 'YDN', away: 'DPU', hScore: 5, aScore: 0 }, { home: 'RKH', away: 'YNG', hScore: 2, aScore: 2 }, { home: 'SHN', away: 'ISP', hScore: 1, aScore: 3 }, { home: 'AYA', away: 'TAU', hScore: 2, aScore: 1 }, { home: 'YMU', away: 'DSU', hScore: 3, aScore: 2 }, { home: 'MAH', away: 'HTU', hScore: 3, aScore: 2 }],
            2: [{ home: 'RKH', away: 'DPU', hScore: 6, aScore: 4 }, { home: 'SHN', away: 'YDN', hScore: 2, aScore: 3 }, { home: 'AYA', away: 'YNG', hScore: 2, aScore: 2 }, { home: 'YMU', away: 'ISP', hScore: 1, aScore: 6 }, { home: 'MAH', away: 'TAU', hScore: 6, aScore: 0 }, { home: 'HTU', away: 'DSU', hScore: 2, aScore: 1 }],
            3: [{ home: 'SHN', away: 'DPU', hScore: 3, aScore: 0 }, { home: 'AYA', away: 'RKH', hScore: 2, aScore: 3 }, { home: 'YMU', away: 'YDN', hScore: 0, aScore: 3 }, { home: 'MAH', away: 'YNG', hScore: 4, aScore: 4 }, { home: 'HTU', away: 'ISP', hScore: 2, aScore: 8 }, { home: 'DSU', away: 'TAU', status: 'Cancelled' }],
            4: [{ home: 'AYA', away: 'DPU', hScore: 3, aScore: 3 }, { home: 'YMU', away: 'SHN', hScore: 2, aScore: 2 }, { home: 'MAH', away: 'RKH', hScore: 5, aScore: 13 }, { home: 'HTU', away: 'YDN', hScore: 1, aScore: 4 }, { home: 'DSU', away: 'YNG', hScore: 0, aScore: 6 }, { home: 'TAU', away: 'ISP', hScore: 2, aScore: 7 }],
            5: [{ home: 'YMU', away: 'DPU', hScore: 3, aScore: 0 }, { home: 'MAH', away: 'AYA', hScore: 4, aScore: 4 }, { home: 'HTU', away: 'SHN', hScore: 3, aScore: 2 }, { home: 'DSU', away: 'RKH', hScore: 3, aScore: 7 }, { home: 'TAU', away: 'YDN', hScore: 3, aScore: 2 }, { home: 'ISP', away: 'YNG', hScore: 3, aScore: 3 }],
            6: [{ home: 'MAH', away: 'DPU', hScore: 0, aScore: 5 }, { home: 'HTU', away: 'YMU', hScore: 3, aScore: 4 }, { home: 'DSU', away: 'AYA', hScore: 2, aScore: 5 }, { home: 'TAU', away: 'SHN', hScore: 2, aScore: 2 }, { home: 'ISP', away: 'RKH', hScore: 3, aScore: 2 }, { home: 'YNG', away: 'YDN', hScore: 2, aScore: 3 }],
            7: [
                { home: 'HTU', away: 'DPU', hScore: 2, aScore: 0 },
                { home: 'DSU', away: 'MAH', hScore: 3, aScore: 0 },
                { home: 'TAU', away: 'YMU', hScore: 3, aScore: 3 },
                { home: 'ISP', away: 'AYA', hScore: 5, aScore: 3 },
                { home: 'YNG', away: 'SHN', hScore: 2, aScore: 3},
                { home: 'YDN', away: 'RKH', hScore: 3, aScore: 1 }
            ]
        };

        let fixtures = [], currentViewingMatchday = 0, TOTAL_ROUNDS = 11;

        window.onload = function() { 
            generateFixedRoundRobinFixtures(); 
            calculateStandings();
            renderMatchdaySelector(); 
            renderFixtures(); 
        };

        function switchTab(tab) {
            document.getElementById('tab-fixtures-content').classList.toggle('hidden', tab !== 'fixtures');
            document.getElementById('tab-standings-content').classList.toggle('hidden', tab !== 'standings');
            
            document.getElementById('tab-fixtures-btn').className = tab === 'fixtures' ? "px-3 py-1.5 rounded-md text-[10px] font-bold text-[#003399] bg-white shadow-lg" : "px-3 py-1.5 rounded-md text-[10px] font-bold text-white";
            document.getElementById('tab-standings-btn').className = tab === 'standings' ? "px-3 py-1.5 rounded-md text-[10px] font-bold text-[#003399] bg-white shadow-lg" : "px-3 py-1.5 rounded-md text-[10px] font-bold text-white";

            if(tab === 'standings') updateStandingsTable();
        }

        function generateFixedRoundRobinFixtures() {
            const numTeams = TEAMS_LIST.length;
            for (let round = 0; round < numTeams - 1; round++) {
                const roundMatches = [];
                for (let i = 0; i < numTeams / 2; i++) {
                    const home = (round + i) % (numTeams - 1), away = (i === 0) ? numTeams - 1 : (numTeams - 1 - i + round) % (numTeams - 1);
                    roundMatches.push({ home: TEAMS_LIST[home].id, away: TEAMS_LIST[away].id });
                }
                fixtures.push(roundMatches);
            }
        }

        function calculateStandings() {
            TEAMS_LIST.forEach(t => { t.mp=0; t.w=0; t.d=0; t.l=0; t.gf=0; t.ga=0; t.gd=0; t.pts=0; });
            
            Object.values(MATCH_RESULTS).forEach(round => {
                round.forEach(match => {
                    if (match.hScore !== undefined && match.aScore !== undefined) {
                        const h = TEAMS_LIST.find(t => t.id === match.home);
                        const a = TEAMS_LIST.find(t => t.id === match.away);
                        
                        if(!h || !a) return;
                        
                        h.mp++; a.mp++;
                        h.gf += match.hScore; h.ga += match.aScore;
                        a.gf += match.aScore; a.ga += match.hScore;
                        h.gd = h.gf - h.ga; a.gd = a.gf - a.ga;

                        if (match.hScore > match.aScore) { h.pts += 3; h.w++; a.l++; }
                        else if (match.hScore < match.aScore) { a.pts += 3; a.w++; h.l++; }
                        else { h.pts += 1; a.pts += 1; h.d++; a.d++; }
                    }
                });
            });
        }

        function renderMatchdaySelector() {
            const container = document.getElementById('matchday-selector-container');
            for (let r = 0; r < TOTAL_ROUNDS; r++) {
                const btn = document.createElement('button');
                btn.className = `flex-shrink-0 px-3 py-1 rounded-lg font-bold text-[10px] border ${r === 0 ? 'bg-[#003399] text-white' : 'bg-white text-slate-500 border-slate-200'}`;
                btn.innerText = `R${r + 1}`;
                btn.onclick = () => { 
                    currentViewingMatchday = r; 
                    document.querySelectorAll('#matchday-selector-container button').forEach((b, idx) => {
                        b.className = `flex-shrink-0 px-3 py-1 rounded-lg font-bold text-[10px] border ${idx === r ? 'bg-[#003399] text-white' : 'bg-white text-slate-500 border-slate-200'}`;
                    });
                    renderFixtures(); 
                };
                container.appendChild(btn);
            }
        }

        function renderFixtures() {
            const container = document.getElementById('fixtures-grid');
            container.innerHTML = '';
            document.getElementById('fixture-round-title').innerText = `ROUND ${currentViewingMatchday + 1}`;
            
            if(!fixtures[currentViewingMatchday]) return;

            fixtures[currentViewingMatchday].forEach(match => {
                const h = TEAMS_LIST.find(t => t.id === match.home);
                const a = TEAMS_LIST.find(t => t.id === match.away);
                
                const result = MATCH_RESULTS[currentViewingMatchday]?.find(r => r.home === h.id && r.away === a.id);
                const isCancelled = result && result.status === 'Cancelled';
                const hasScore = result && result.hScore !== undefined && result.aScore !== undefined;
                
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-100 rounded-xl p-3 flex items-center justify-between shadow-sm";
                card.innerHTML = `
                    <a href="${h.tg}" target="_blank" class="flex items-center gap-2 w-[40%] cursor-pointer hover:opacity-70">
                        <img src="${h.logo}" class="w-8 h-8 object-contain">
                        <span class="text-xs font-bold truncate text-slate-700">${h.name}</span>
                    </a>
                    <div class="flex flex-col items-center w-[20%]">
                        ${isCancelled ? `<span class="text-red-500 font-black text-[8px] uppercase">Cancelled</span>` : (hasScore ? `<span class="text-[#003399] font-black text-sm">${result.hScore} - ${result.aScore}</span>` : '<span class="text-[#003399] font-black text-[10px]">VS</span>')}
                    </div>
                    <a href="${a.tg}" target="_blank" class="flex items-center gap-2 w-[40%] justify-end cursor-pointer hover:opacity-70">
                        <span class="text-xs font-bold truncate text-slate-700">${a.name}</span>
                        <img src="${a.logo}" class="w-8 h-8 object-contain">
                    </a>`;
                container.appendChild(card);
            });
        }

        function updateStandingsTable() {
            const tbody = document.getElementById('standings-table-body');
            const sortedTeams = [...TEAMS_LIST].sort((a, b) => b.pts - a.pts || b.gd - a.gd);
            
            tbody.innerHTML = sortedTeams.map((team, idx) => `
                <tr class="hover:bg-blue-50 transition-colors">
                    <td class="py-3 px-2 text-slate-500">${idx+1}</td>
                    <td class="text-left py-3 pl-2">
                        <a href="${team.tg}" target="_blank" class="flex items-center gap-2 cursor-pointer hover:underline">
                            <img src="${team.logo}" class="w-5 h-5 object-contain">
                            <span class="font-bold text-slate-800">${team.name}</span>
                        </a>
                    </td>
                    <td class="py-3">${team.mp}</td>
                    <td class="py-3">${team.w}</td>
                    <td class="py-3">${team.d}</td>
                    <td class="py-3">${team.l}</td>
                    <td class="py-3 hidden sm:table-cell">${team.gf}</td>
                    <td class="py-3 hidden sm:table-cell">${team.ga}</td>
                    <td class="py-3">${team.gd}</td>
                    <td class="py-3 font-black text-[#003399]">${team.pts}</td>
                </tr>
            `).join('');
        }
        
        function changeMatchday(d) {
            let n = currentViewingMatchday + d;
            if (n >= 0 && n < TOTAL_ROUNDS) { 
                currentViewingMatchday = n; 
                document.querySelectorAll('#matchday-selector-container button').forEach((b, idx) => {
                    b.className = `flex-shrink-0 px-3 py-1 rounded-lg font-bold text-[10px] border ${idx === n ? 'bg-[#003399] text-white' : 'bg-white text-slate-500 border-slate-200'}`;
                });
                renderFixtures(); 
            }
        }
    </script>
</body>
</html>
